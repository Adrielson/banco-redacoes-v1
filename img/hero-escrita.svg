<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-labelledby="titulo-ilustracao">
  <title id="titulo-ilustracao">Ilustração: livros, um caderno aberto e um lápis escrevendo</title>
  <defs>
    <linearGradient id="g-pagina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0fb"/>
    </linearGradient>
    <linearGradient id="g-lapis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="0.5" stop-color="#fbd96b"/>
      <stop offset="1" stop-color="#e9b630"/>
    </linearGradient>
    <radialGradient id="g-brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- brilho de fundo -->
  <circle cx="215" cy="190" r="160" fill="url(#g-brilho)"/>

  <!-- pilha de livros -->
  <g transform="translate(36 236)">
    <rect x="0" y="62" width="168" height="30" rx="5" fill="#27ae60"/>
    <rect x="8" y="68" width="152" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="14" y="30" width="150" height="32" rx="5" fill="#667eea"/>
    <rect x="22" y="36" width="134" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
    <rect x="24" y="0" width="128" height="30" rx="5" fill="#f39c12"/>
    <rect x="32" y="6" width="112" height="6" rx="3" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- caderno aberto -->
  <g transform="translate(150 120) rotate(-6 120 80)">
    <path d="M10 22 Q70 6 122 26 L122 176 Q70 158 10 172 Z" fill="url(#g-pagina)" stroke="#c7cdf3" stroke-width="2"/>
    <path d="M122 26 Q176 6 236 22 L236 172 Q176 158 122 176 Z" fill="url(#g-pagina)" stroke="#c7cdf3" stroke-width="2"/>
    <path d="M122 26 L122 176" stroke="#b6bdf0" stroke-width="3"/>
    <!-- pautas -->
    <g stroke="#c9d6ea" stroke-width="2">
      <path d="M24 50 Q68 40 110 54"/><path d="M24 74 Q68 64 110 78"/><path d="M24 98 Q68 88 110 102"/>
      <path d="M24 122 Q68 112 110 126"/><path d="M24 146 Q68 136 110 150"/>
      <path d="M134 54 Q178 40 222 50"/><path d="M134 78 Q178 64 222 74"/><path d="M134 102 Q178 88 222 98"/>
      <path d="M134 126 Q178 112 222 122"/><path d="M134 150 Q178 136 222 146"/>
    </g>
    <!-- texto escrito à mão -->
    <g stroke="#1e2f6b" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M32 46 q6 -8 12 0 t12 0 t12 0 t12 0 t12 -2 t10 0"/>
      <path d="M26 70 q6 -8 12 0 t12 0 t12 0 t12 0 t12 -2 t12 0"/>
      <path d="M26 94 q6 -8 12 0 t12 0 t12 0 t12 0"/>
      <path d="M140 48 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t10 -2"/>
      <path d="M136 72 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0"/>
    </g>
    <!-- margem vermelha -->
    <path d="M20 30 L20 168" stroke="#e8a3a3" stroke-width="2"/>
  </g>

  <!-- lápis -->
  <g transform="translate(300 64) rotate(38)">
    <rect x="0" y="0" width="26" height="150" rx="4" fill="url(#g-lapis)"/>
    <rect x="0" y="0" width="26" height="22" rx="4" fill="#e74c3c"/>
    <rect x="0" y="18" width="26" height="10" fill="#bdc3c7"/>
    <path d="M0 150 L13 186 L26 150 Z" fill="#f5d6a8"/>
    <path d="M8 172 L13 186 L18 172 Z" fill="#2c3e50"/>
  </g>

  <!-- letras flutuando -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="58" y="96" font-size="44" opacity="0.85">“</text>
    <text x="352" y="252" font-size="40" opacity="0.8">”</text>
    <text x="92" y="186" font-size="26" opacity="0.6" font-style="italic">ç</text>
    <text x="372" y="140" font-size="24" opacity="0.6" font-style="italic">ã</text>
    <text x="190" y="62" font-size="22" opacity="0.55" font-style="italic">a</text>
  </g>

  <!-- estrelinhas -->
  <g fill="#fde68a">
    <path d="M344 40 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
    <path d="M64 150 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 Z" opacity="0.8"/>
  </g>
</svg>
