<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-labelledby="titulo-ilustracao">
  <title id="titulo-ilustracao">Ilustração: uma estudante aponta para a correção de uma redação na tela de um celular, com lápis e lupa</title>
  <defs>
    <linearGradient id="g-tela" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0fb"/>
    </linearGradient>
    <linearGradient id="g-lapis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f51c9"/>
      <stop offset="0.45" stop-color="#667eea"/>
      <stop offset="1" stop-color="#4a5ad0"/>
    </linearGradient>
    <linearGradient id="g-calca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3346c4"/>
      <stop offset="1" stop-color="#2533a0"/>
    </linearGradient>
  </defs>

  <!-- fundo: círculo claro, manchas e engrenagens -->
  <circle cx="222" cy="188" r="168" fill="#eef0fb" opacity="0.95"/>
  <path d="M28 250 Q14 196 58 172 Q104 150 116 206 Q128 262 86 290 Q42 314 28 250 Z" fill="#c7cdf3" opacity="0.75"/>
  <path d="M330 300 Q356 252 398 266 Q426 282 410 318 Q392 352 350 344 Q318 334 330 300 Z" fill="#c7cdf3" opacity="0.75"/>
  <path d="M60 120 Q46 92 74 84 Q98 80 98 106 Q96 132 72 134 Q62 134 60 120 Z" fill="#f6c9c2" opacity="0.6"/>
  <g fill="none" stroke="#d6daf5">
    <circle cx="300" cy="54" r="22" stroke-width="10" stroke-dasharray="7 5.5"/>
    <circle cx="300" cy="54" r="9" stroke-width="5"/>
    <circle cx="352" cy="112" r="30" stroke-width="12" stroke-dasharray="8 6.6"/>
    <circle cx="352" cy="112" r="12" stroke-width="6"/>
  </g>

  <!-- celular -->
  <rect x="150" y="40" width="172" height="292" rx="24" fill="#1e1b4b"/>
  <rect x="160" y="54" width="152" height="264" rx="12" fill="url(#g-tela)"/>
  <rect x="214" y="45" width="44" height="5" rx="2.5" fill="#3b3880"/>

  <!-- a redação na tela -->
  <text x="166" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#1e1b4b">T</text>
  <g fill="#c9cff0">
    <rect x="212" y="70" width="52" height="5" rx="2.5"/><rect x="270" y="70" width="32" height="5" rx="2.5"/>
    <rect x="212" y="94" width="34" height="5" rx="2.5"/>
    <rect x="212" y="118" width="90" height="5" rx="2.5"/>
    <rect x="170" y="138" width="56" height="5" rx="2.5"/><rect x="232" y="138" width="70" height="5" rx="2.5"/>
    <rect x="170" y="154" width="40" height="5" rx="2.5"/><rect x="216" y="154" width="86" height="5" rx="2.5"/>
    <rect x="170" y="170" width="78" height="5" rx="2.5"/><rect x="254" y="170" width="48" height="5" rx="2.5"/>
    <rect x="170" y="200" width="64" height="5" rx="2.5"/><rect x="240" y="200" width="62" height="5" rx="2.5"/>
    <rect x="170" y="216" width="90" height="5" rx="2.5"/><rect x="266" y="216" width="36" height="5" rx="2.5"/>
    <rect x="170" y="232" width="46" height="5" rx="2.5"/><rect x="222" y="232" width="80" height="5" rx="2.5"/>
    <rect x="170" y="248" width="70" height="5" rx="2.5"/>
    <rect x="170" y="296" width="44" height="5" rx="2.5"/><rect x="220" y="296" width="60" height="5" rx="2.5"/>
  </g>
  <!-- trechos marcados pela correção -->
  <g fill="#f08a7e">
    <rect x="252" y="94" width="50" height="5" rx="2.5"/>
    <rect x="170" y="264" width="54" height="5" rx="2.5"/><rect x="230" y="264" width="72" height="5" rx="2.5"/>
    <rect x="170" y="280" width="82" height="5" rx="2.5"/><rect x="258" y="280" width="44" height="5" rx="2.5"/>
  </g>
  <g stroke="#f08a7e" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M262 134 L292 176 M292 134 L262 176"/>
    <path d="M170 184 Q200 180 228 184"/>
    <path d="M174 192 Q236 186 302 190"/>
    <path d="M284 242 L294 252 M294 242 L284 252"/>
  </g>

  <!-- balão com lápis -->
  <path d="M74 54 Q78 30 116 30 Q156 32 156 66 Q154 100 118 102 L108 124 L100 100 Q74 94 74 70 Z" fill="#8a9bea"/>
  <g transform="rotate(-45 116 66)">
    <rect x="94" y="60" width="36" height="12" rx="2" fill="#3346c4"/>
    <rect x="124" y="60" width="8" height="12" rx="2" fill="#2533a0"/>
    <path d="M94 60 L82 66 L94 72 Z" fill="#c7cdf3"/>
  </g>

  <!-- estudante apontando para a tela -->
  <g>
    <path d="M96 172 Q90 150 108 146 Q126 144 128 162 Q130 186 122 210 Q104 214 92 204 Q98 190 96 172 Z" fill="#1e1b4b"/>
    <circle cx="112" cy="166" r="15" fill="#f5c6a8"/>
    <path d="M97 162 Q100 146 116 148 Q128 150 127 164 Q118 156 104 160 Z" fill="#1e1b4b"/>
    <path d="M94 190 Q112 182 130 190 L134 252 L90 252 Z" fill="#f08a7e"/>
    <path d="M126 194 Q148 212 168 222" stroke="#f08a7e" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M166 218 Q178 216 182 222 Q176 228 166 228 Z" fill="#f5c6a8"/>
    <path d="M90 250 L134 250 L132 330 L118 330 L112 276 L104 330 L88 326 Z" fill="url(#g-calca)"/>
    <ellipse cx="96" cy="332" rx="11" ry="5" fill="#ffffff"/>
    <ellipse cx="126" cy="334" rx="11" ry="5" fill="#ffffff"/>
  </g>

  <!-- lápis grande -->
  <g transform="translate(352 104) rotate(24)">
    <path d="M-12 32 L0 0 L12 32 Z" fill="#f5d6a8"/>
    <path d="M-4 11 L0 0 L4 11 Z" fill="#f08a7e"/>
    <rect x="-12" y="32" width="24" height="176" fill="url(#g-lapis)"/>
    <rect x="-12" y="196" width="24" height="12" fill="#f08a7e"/>
  </g>

  <!-- lupa -->
  <g>
    <path d="M326 290 L294 324" stroke="#2533a0" stroke-width="13" stroke-linecap="round"/>
    <path d="M319 297 L312 305" stroke="#f08a7e" stroke-width="13"/>
    <circle cx="352" cy="262" r="34" fill="#ffffff" fill-opacity="0.55" stroke="#3346c4" stroke-width="10"/>
    <path d="M340 240 Q328 250 330 266" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>
